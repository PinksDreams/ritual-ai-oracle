name: Ritual AI Oracle

permissions:
  contents: write

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  update-oracle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run AI Oracle
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: node backend/oracle.js

      - name: Commit updated news
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add frontend/public/news.json

          git commit -m "update news feed" || echo "No changes"

          git push origin main